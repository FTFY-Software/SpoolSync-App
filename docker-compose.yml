services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spoolsync
      POSTGRES_USER: spoolsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spoolsync_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoolsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/spool-sync/spoolsync-backend:${SPOOLSYNC_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spoolsync:${POSTGRES_PASSWORD:-spoolsync_dev}@postgres:5432/spoolsync?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PRINTER_POLL_INTERVAL_MS: ${PRINTER_POLL_INTERVAL_MS:-30000}
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      BROWSERLESS_URL: ${BROWSERLESS_URL:-}
    volumes:
      - integrations_data:/app/integrations/printers
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"

  frontend:
    image: ghcr.io/spool-sync/spoolsync-frontend:${SPOOLSYNC_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  integrations_data:
